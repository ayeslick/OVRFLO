# Scratch decision record — schema: docs/maps/SCHEMAS.md §4
summary_ref: "docs/plans/2026-08-22-001-refactor-denomination-switch-border-column-plan.md#cs4-u5"

goal: >
  CS4-U5 named surface states only. Every named product state has at most
  one primary action and one secondary recovery action. The request-book
  UI consumes CS3 post, execute, wait, and cancel. Quote refresh and
  pending suppress stale submit. Closing the modal is not cancel.

