# Scratch decision record — schema: docs/maps/SCHEMAS.md §4
summary_ref: "docs/plans/2026-08-22-001-refactor-denomination-switch-border-column-plan.md#cs3-u1"

goal: >
  Give OVRFLORequestBook a per-wallet resting list (requestCount /
  requestAt). Your OVRFLO pages that list the same way it pages loans.
  Stop walking global request ids. Do not use browser getLogs to find
  a live cancellable request.

state_keys_touched:
  - query.request-book

writers_readers:
  - writes: src/OVRFLORequestBook.sol
  - writes: test/OVRFLORequestBook.t.sol
  - writes: artifacts/tests/storage-layout/OVRFLORequestBook.json
  - writes: web/lib/generated.ts
  - writes: web/lib/protocol/request-book.ts
  - writes: web/hooks/useRequestBook.ts
  - writes: web/components/watch/WatchApp.tsx
  - writes: docs/maps/state/keys/chain-reads.md
  - writes: CONCEPTS.md
  - reads: web/lib/portfolio-matrix.ts

trust_domains:
  - fact: Resting request ids for one wallet
    domain: on-chain
    moved_from: null
  - fact: Resting request row from requests(id)
    domain: on-chain
    moved_from: null

rejected_alternatives:
  - option: Browser RequestPosted getLogs as the live list
    why_not: >
      A live cancellable row is custody. Activity may scan logs in the
      browser because that page is history. Your OVRFLO must not.
  - option: Page global ids 1..N with no cap
    why_not: Most slots belong to other wallets. Cost follows every post.
  - option: Append-only list like borrowerLoanAt
    why_not: >
      A filled request becomes a loan. A cancelled request is gone. Those
      ids must leave the waiting list.

invariants_held:
  - invariant: Only a resting request sits in requestAt.
    how: _list runs in _rest. _unlist runs with delete on execute and cancel.
  - invariant: Immediate fill never enters the list.
    how: _fill from post does not write requests[id] and does not call _list.
  - invariant: Empty requires a complete page walk of this wallet's count.
    how: Completeness follows requestCount, not nextRequestId.
  - invariant: cancel does not read the router slot.
    how: _unlist is storage only. Cancel still transfers the stream after delete.

risks:
  - risk: A replaced book still holds resting rows the new router list omits.
    residual: >
      Closed by 2026-09-03-prior-router-history.yaml. Factory
      priorRouterAt lists the outgoing book. Your OVRFLO pages that list.
  - risk: Execute still deletes after core borrow.
    residual: Same as live CS3. Unlist stays with that delete. nonReentrant holds.

diff_hints:
  - path: src/OVRFLORequestBook.sol
    why: requestCount, requestAt, _list, _unlist. Rest lists. Fill and cancel unlist.
  - path: web/lib/protocol/request-book.ts
    why: Page requestCount / requestAt. Remove the 1..500 walk.
  - path: web/hooks/useRequestBook.ts
    why: Same 25-row infinite query as useBorrowerBook.
