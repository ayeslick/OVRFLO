# Scratch decision record — schema: docs/maps/SCHEMAS.md §4
# U5 review fixes — authored before first code write.

summary_ref: "feat/u5-main-repo-rebind review fixes (orchestrator-decided)"

goal: >
  Apply decided review fixes on feat/u5-main-repo-rebind: stamp borrower/lender
  dataUpdatedAt so Borrowed/Supplied keep signingAllowed; stop STREAM CLOSED
  during pledge hydration; drop the pledged Streams overlay (AE2/KTD2);
  fail-closed when balance>0 yields no ids; branch settled copy on burn vs
  return; require AE6 full-value burn; rewrite discovery docs to Enumerable.

