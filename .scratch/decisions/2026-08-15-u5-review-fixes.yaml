    why: dataUpdatedAt on ready/unavailable.
  - path: web/hooks/useLenderBook.ts
    why: dataUpdatedAt on ready/unavailable including loansOf pages.
  - path: web/components/watch/WatchApp.tsx
    why: ownedStreams; STREAM CLOSED vs open loan.
  - path: web/lib/watch-rows.ts
    why: settled copy branches on streamPresent.
  - path: src/OVRFLOLending.sol
    why: Closed event @notice and Repaid event @dev only.
  - path: web/tests/e2e/steps/streams.ts
    why: AE6 require burn; AE2 no pledged Streams row.
