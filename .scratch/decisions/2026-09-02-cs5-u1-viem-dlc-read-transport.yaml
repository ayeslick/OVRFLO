# Scratch decision record — schema: docs/maps/SCHEMAS.md §4
summary_ref: "docs/plans/2026-08-22-001-refactor-denomination-switch-border-column-plan.md#cs5-u1"

goal: >
  Pin @morpho-org/viem-dlc npm 0.0.16 (commit 0df02a9a79bce8ed0a98974034d34cf5c8de7e11)
  behind the existing public-read RPC seam. Each RPC URL gets its own ordered
  range/rate/burst/concurrency policy. TanStack Query stays the only UI chain-state
  store. Wallet clients and writes stay outside viem-dlc.

state_keys_touched: []

writers_readers:
  - writes: web/lib/rpc.ts
  - writes: web/lib/wagmi.ts
  - reads: web/lib/query-client.ts
  - reads: web/hooks/useWriteFlow.ts
  - reads: web/components/WalletRuntime.tsx
  - reads: web/tests/e2e/support/WalletRuntime.tsx

trust_domains:
  - fact: public RPC transport, failover, and per-URL rate limits
    domain: on-chain
    moved_from: null
  - fact: TanStack Query cache ownership
    domain: on-chain
    moved_from: null
  - fact: wallet connector writes
    domain: on-chain
    moved_from: null

rejected_alternatives:
  - option: Wrap public reads with cache() and LruStore
    why_not: KD18 and CS5 stop conditions forbid a second UI chain-state store.
  - option: Call logsDivider or policy() in this ticket
    why_not: Ticket 13 owns logsDivider portfolio completeness. Ticket 14 owns deployless probes.
  - option: Wrap WagmiAdapter wallet connectors or E2E mock transports
    why_not: KD18 write-boundary. viem-dlc must not transform, submit, batch, or retry writes.
  - option: Keep viem fallback as the ordered public-read dispatcher
    why_not: viem fallback rebuilds branches per call and drops per-URL token buckets.

invariants_held:
  - invariant: TanStack Query is the only UI chain-state store
    how: query-client.ts stays the QueryClient owner. rpc.ts does not import stores or cache().
  - invariant: Wallet writes never import, wrap, or invoke viem-dlc
    how: Only rpc.ts imports the package. Historical, E2E, and connector transports stay plain http.
  - invariant: execution_reverted and unknown_block do not fail over
    how: failover shouldThrow uses classifyRpcFailure plus defaultShouldThrow.
  - invariant: Per-URL budgets do not share
    how: wrapPublicReadTransport builds one rateLimiter per URL before failover.

risks:
  - risk: maxBlockRange is bound per URL but logsDivider is not composed yet
    residual: Ticket 13 consumes the same ordered policy for bounded getLogs.
  - risk: usePublicClient simulation rides the public-read transport
    residual: rateLimiter and failover do not transform write calldata. Ticket 14 keeps deployless off writes.

diff_hints:
  - path: web/lib/rpc.ts
    why: Pin, ordered per-URL policy, rateLimiter wrap, failover shouldThrow.
  - path: web/package.json
    why: Exact 0.0.16 runtime exception. No caret.
  - path: web/lib/query-client.ts
    why: Confirm the query client remains the only chain-state store.
  - path: web/lib/wagmi.ts
    why: Public-read transports only. No direct viem-dlc import.
  - path: web/tests/lib/rpc.test.ts
    why: Failover, isolation, policy order, stop set.
  - path: web/tests/lib/performance-contract.test.ts
    why: Pin provenance and write/store isolation.
