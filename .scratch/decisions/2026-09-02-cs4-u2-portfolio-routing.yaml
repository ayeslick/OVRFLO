# Scratch decision record — schema: docs/maps/SCHEMAS.md §4
summary_ref: "docs/plans/2026-08-22-001-refactor-denomination-switch-border-column-plan.md#cs4-u2"

goal: >
  Route Your OVRFLO from complete bounded discovery plus direct hydration.
  Incomplete scans stay on an incomplete surface. Complete hydration writes
  the KD16 URL matrix. Activity lists chain-confirmed rows on /activity/.

state_keys_touched:
  - watch.portfolio-type
  - watch.selected-entity
  - watch.lens
  - watch.narrow-nav
  - projection.portfolio-candidates
  - projection.activity
  - chain.vault-registry
  - chain.lender-book
  - chain.borrower-book

writers_readers:
  - writes: web/lib/portfolio-matrix.ts
  - writes: web/lib/watch-url.ts
  - writes: web/lib/watch-lendings.ts
  - writes: web/lib/discovery/portfolio-log-candidates.ts
  - writes: web/components/watch/WatchApp.tsx
  - writes: web/app/activity/page.tsx
  - reads: web/components/watch/WatchApp.tsx
  - reads: web/components/watch/Wall.tsx
  - reads: web/app/activity/page.tsx
  - reads: web/hooks/useLenderBook.ts
  - reads: web/hooks/useBorrowerBook.ts

trust_domains:
  - fact: aggregate count and scan completeness
    domain: projection
    moved_from: null
  - fact: position ownership, type, status, amount after hydration
    domain: on-chain
    moved_from: projection
  - fact: destination query after complete hydration
    domain: pure-client
    moved_from: null
  - fact: activity rows from verified logs
    domain: projection
    moved_from: null
  - fact: retired-market marker
    domain: on-chain
    moved_from: null

rejected_alternatives:
  - option: Route from the first page or from log-candidate counts
    why_not: AS3. Provisional counts must not choose empty, detail, or collection.
  - option: Wait for CS5-U2 optional enrichment before routing
    why_not: Enumeration on active plus retired markets is enough. Logs are display-only.
  - option: Treat unpledged streams as a third Default type
    why_not: KD16 names two Default types. Streams stay Advanced density on the same path.
  - option: Sum mixed-symbol collection totals
    why_not: KD16. Group by underlying. Never sum unlike symbols.
  - option: Build create flows or named retired-market actions here
    why_not: Ticket 16 owns create. Ticket 19 owns the retired-market action set.

invariants_held:
  - invariant: Incomplete scan never writes ?type= or identity from a count
    how: applyPortfolioSearch returns skip until lender and borrower books are complete and streams are not loading.
  - invariant: Log candidates never gate a write
    how: Scanner output feeds display and activity only. WatchWrite still re-reads chain.
  - invariant: Retired-market positions count in the matrix
    how: uniqueLendings includes VaultInfo.retiredLendings. Marker is display-only.
  - invariant: /activity/ does not apply the matrix
    how: Activity is its own page. WatchApp mounts only on /.
  - invariant: Unlike symbols are never summed
    how: groupTotalsByUnderlying keys on underlying. Mixed groups show counts plus per-symbol totals.

risks:
  - risk: Seed wallets with mixed types make old lens e2e miss collection rows
    residual: Lens steps open Advanced for STREAMS and open the matching type card for BORROWED/SUPPLIED.
  - risk: Unread book pages would make a first-page count look complete
    how: WatchApp drains pagers until complete is true. Unread pages stay incomplete.
  - risk: A failed stream read could look like empty
    residual: Empty requires stream book complete and confirmed empty as well as zero loans and supplies.

diff_hints:
  - path: web/lib/portfolio-matrix.ts
    why: Count/type matrix and URL apply. Incomplete skip. Stale identity strip.
  - path: web/components/watch/WatchApp.tsx
    why: Default surfaces vs Advanced wall. No matrix writes on incomplete.
  - path: web/lib/watch-lendings.ts
    why: Retired markets join the enumeration set.
  - path: web/lib/discovery/portfolio-log-candidates.ts
    why: Activity rows from the same getLogs owner. Newest first.
  - path: web/app/activity/page.tsx
    why: Chain-confirmed list. Incomplete label. No matrix.
  - path: web/tests/e2e/watch.feature
    why: Zero/one/same-type/mixed matrix plus URL writes.
